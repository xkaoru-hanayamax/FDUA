services:
  snowflake-llm:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./cli:/app/cli
    command: python -m cli.run_agent --all

  langgraph-studio:
    build: .
    env_file:
      - .env
    ports:
      - "8123:8123"
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install -e . && langgraph dev --host 0.0.0.0 --port 8123"
