services:
  snowflake-llm:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    command: python financial_analyzer.py

  langgraph-studio:
    build: .
    env_file:
      - .env
    ports:
      - "8123:8123"
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install -e . && langgraph dev --host 0.0.0.0 --port 8123"
